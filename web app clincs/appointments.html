<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Appointment Scheduler</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <a href="index.html" class="menu-link">Dashboard</a>
      <a href="patients.html" class="menu-link">Patients</a>
      <a href="labos.html" class="menu-link">Lab Work</a>
      <a href="reception.html" class="menu-link">Reception</a>
      <a href="expenses.html" class="menu-link">Expense</a>
      <a href="medical.html" class="menu-link">Medical Supplies</a>
      <a href="appointments.html" class="menu-link active">Appointments</a>
      <a href="chatbot.html" class="menu-link">AI Chatbot</a>

    </div>

    <div class="content">
      <h1>Appointment Scheduler</h1>

      <form id="appointmentForm">
        <label>
          Patient:
          <input type="text" id="patientName" placeholder="Name" required>
        </label>

        <label>
          Date:
          <input type="date" id="appointmentDate" required />
        </label>

        <label>
          Time:
          <input type="time" id="appointmentTime" required />
        </label>

        <label>
          Duration (minutes):
          <input type="number" id="appointmentDuration" min="15" max="180" value="30" required />
        </label>

        <label>
          Status:
          <select id="appointmentStatus">
            <option value="Scheduled" selected>Scheduled</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </label>

        <label>
          Notes:
          <textarea id="appointmentNotes" rows="3"></textarea>
        </label>

        <button type="submit">Add Appointment</button>
      </form>

      <h2>Appointments</h2>
      <label>
        View Date:
        <input type="date" id="viewDate" />
      </label>

      <table id="appointmentsTable" cellspacing="0" cellpadding="5">
        <thead>
          <tr>
            <th>Patient</th>
            <th>Date</th>
            <th>Time</th>
            <th>Duration</th>
            <th>Status</th>
            <th>Notes</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <script src="assets/js/firebase.js"></script>
  <script src="assets/js/appointments.js"></script>
  

  <script>
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "login.html";
    }
  </script>
  
</body>
</html>
