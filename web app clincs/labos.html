<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Lab Work</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <a href="index.html" class="menu-link">Dashboard</a>
      <a href="patients.html" class="menu-link">Patients</a>
      <a href="labos.html" class="menu-link active">Lab Work</a>
      <a href="reception.html" class="menu-link">Reception</a>
      <a href="expenses.html" class="menu-link">Expense</a>
      <a href="medical.html" class="menu-link">Medical Supplies</a>
      <a href="appointments.html" class="menu-link">Appointments</a>
      <a href="chatbot.html" class="menu-link">AI Chatbot</a>

    </div>
    <div class="content">
      <h1>Lab Work</h1>
      <form id="laboForm">
        <input type="text" id="laboName" placeholder="Name" required />
        <input type="number" id="laboPrice" placeholder="Price" required />
        <input type="date" id="laboDate" required />
        <select id="laboStatus" required>
          <option disabled selected>Status</option>
          <option>Working</option>
          <option>Delivered</option>
        </select>
        <input type="date" id="laboSendDate" placeholder="Date Sent" required />
        <input type="text" id="laboNote" placeholder="Note" />
        <button type="submit">Add Labo</button>
      </form>
      <table id="laboTable">
        <thead><tr><th>Name</th><th>Price</th><th>Date</th><th>Status</th><th>Send Date</th><th>Note</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <!-- Labo Edit Modal -->
<div id="laboModal" class="modal" style="display:none;">
  <div class="modal-content">
    <span id="laboModalClose" class="close">&times;</span>
    <form id="laboForm">
      <input type="text" id="laboName" placeholder="Patient Name" required />
      <input type="number" id="laboPrice" placeholder="Cost" required min="0" step="0.01" />
      <input type="date" id="laboDate" required />
      <select id="laboStatus" required>
        <option value="">Select Status</option>
        <option value="Pending">Pending</option>
        <option value="Completed">Completed</option>
        <option value="Sent">Sent</option>
      </select>
      <input type="date" id="laboSendDate" required />
      <textarea id="laboNote" placeholder="Notes"></textarea>
      <button type="submit">Add Labo</button>
    </form>
  </div>
</div>

  
  <script src="assets/js/common.js"></script>
  <script src="assets/js/labos.js"></script>
  <!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-database.js"></script>

<!-- Your firebase config -->
<script src="firebase.js"></script>

  <script>
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "login.html";
    }
  </script>
  
</body>
</html>
