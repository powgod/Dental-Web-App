<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reception Waiting List</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .clock {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <a href="index.html" class="menu-link">Dashboard</a>
      <a href="patients.html" class="menu-link">Patients</a>
      <a href="labos.html" class="menu-link">Lab Work</a>
      <a href="reception.html" class="menu-link active">Reception</a>
      <a href="expenses.html" class="menu-link">Expense</a>
      <a href="medical.html" class="menu-link">Medical Supplies</a>
      <a href="appointments.html" class="menu-link">Appointments</a>
      <a href="chatbot.html" class="menu-link">AI Chatbot</a>
      <div style="margin-top: auto; padding: 20px; text-align: center;">
        <button id="logoutBtn"
          style="background-color: #ff4d4d; border: none; padding: 10px 20px; color: white; font-size: 14px; border-radius: 5px; cursor: pointer;">
          Logout
        </button>
      </div>
      

    </div>
    <div class="content">
      <h1>Reception - Waiting List</h1>
      <div class="clock" id="currentTime"></div>
      <input type="text" id="patientwaitingName" placeholder="Name" required>
      <input type="text" id="patientwaitingPhone" placeholder="Phone" required>
      <input type="text" id="patientwaitingwork" placeholder="Work" required>
      <table id="waitingTable"></table>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="assets/js/firebase.js"></script>
  <script src="assets/js/reception.js"></script>


  <script>
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "login.html";
    }
  </script>
  
</body>
</html>
